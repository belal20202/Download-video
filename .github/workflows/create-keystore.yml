name: Create signing key (run once)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate key
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          ALIAS=videodl
          keytool -genkeypair -storetype PKCS12 -keystore release.jks -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=VideoDL"
          {
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$(base64 -w 0 release.jks)"
          } > keystore-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
