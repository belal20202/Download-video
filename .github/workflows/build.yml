name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # الاختبارات لا توقف البناء حالياً (لأنها لم تُجرَّب بعد). بعد أن تنجح مرة، احذف السطر continue-on-error
      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Prepare signing key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=Release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key found. Building a DEBUG apk (not for sharing)."
            echo "BUILD_TYPE=Debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK (auto retry)
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ($BUILD_TYPE) ==="
            if gradle assemble${BUILD_TYPE} --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Build failed, retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDL-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
