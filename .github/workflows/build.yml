name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK (auto retry)
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            if gradle assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Build failed, retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDL-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
